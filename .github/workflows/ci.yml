name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: [check, fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  test:
    name: Test
    needs: [check, fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mercurial (if missing)
        run: command -v hg || (sudo apt-get update && sudo apt-get install -y mercurial)
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install Jujutsu (if missing)
        run: command -v jj || cargo binstall --strategies crate-meta-data jj-cli --no-confirm
      - run: cargo test

  build-binaries:
    name: Build ${{ matrix.target }} (Draft Release)
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version and check minor
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          if [ $((MINOR % 2)) -eq 1 ]; then
            echo "is_odd=true" >> $GITHUB_OUTPUT
          else
            echo "is_odd=false" >> $GITHUB_OUTPUT
          fi
          echo "Version: $VERSION, Minor: $MINOR, Is odd: $((MINOR % 2))"

      - name: Skip if minor version is even
        if: steps.version.outputs.is_odd == 'false'
        run: |
          echo "Minor version is even (${{ steps.version.outputs.minor }}), skipping binary build"
          exit 0

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux' && steps.version.outputs.is_odd == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.is_odd == 'true'

      - name: Build
        if: steps.version.outputs.is_odd == 'true'
        run: cargo build --release

      - name: Package binary (unix)
        if: runner.os != 'Windows' && steps.version.outputs.is_odd == 'true'
        run: |
          cd target/release
          tar -czvf ../../tuicr-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz tuicr

      - name: Package binary (windows)
        if: runner.os == 'Windows' && steps.version.outputs.is_odd == 'true'
        run: |
          cd target/release
          7z a ../../tuicr-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip tuicr.exe

      - name: Create or update draft release
        if: steps.version.outputs.is_odd == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-draft
          name: v${{ steps.version.outputs.version }} (Draft)
          draft: true
          generate_release_notes: true
          files: |
            tuicr-*.tar.gz
            tuicr-*.zip
